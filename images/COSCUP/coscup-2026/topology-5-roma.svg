<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-label="所有人在同一個聊天室對同一顆 agent 講話，那顆 agent 讀寫同一份 GitHub Issue">
  <style>
    .lbl   { font-family: 'Source Sans Pro','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif; fill: #f0f0f0; }
    .who   { font-size: 22px; font-weight: 700; }
    .small { font-size: 15px; fill: #9a9a9a; }
    .store { font-size: 19px; font-weight: 700; }
    .good  { font-size: 16px; fill: #4ec9b0; }
    .link  { stroke: #4ec9b0; stroke-width: 2.5; fill: none; opacity: .8; }
    .share { stroke: #4ec9b0; stroke-width: 4; fill: none; }
    .box   { fill: #232323; stroke: #7a7a7a; stroke-width: 1.5; }
    .human { fill: #1d1d1d; stroke: #f0f0f0; stroke-width: 2.5; }
    .issue { fill: #1d1d1d; stroke: #4ec9b0; stroke-width: 3; }
    .roma  { fill: #1d1d1d; stroke: #4ec9b0; stroke-width: 4; }
  </style>

  <!-- 三個人 → 同一顆 agent -->
  <g class="link">
    <path d="M118 70  C 220 70,  260 150, 336 168"/>
    <path d="M118 200 H 330"/>
    <path d="M118 330 C 220 330, 260 250, 336 232"/>
  </g>

  <!-- roma → issue -->
  <path class="share" d="M494 200 H 604"/>

  <!-- 人 -->
  <g>
    <circle class="human" cx="86" cy="70"  r="32"/>
    <circle class="human" cx="86" cy="200" r="32"/>
    <circle class="human" cx="86" cy="330" r="32"/>
  </g>
  <g class="lbl who" text-anchor="middle">
    <text x="86" y="78">我</text>
    <text x="86" y="208">A</text>
    <text x="86" y="338">B</text>
  </g>

  <!-- 同一顆 agent -->
  <circle class="roma" cx="412" cy="200" r="82"/>
  <text class="lbl" x="412" y="196" text-anchor="middle" style="font-size:28px;font-weight:700">roma</text>
  <text class="lbl small" x="412" y="222" text-anchor="middle">一個聊天室</text>

  <!-- issue -->
  <rect class="issue" x="604" y="118" width="252" height="164" rx="12"/>
  <text class="lbl store" x="730" y="188" text-anchor="middle">GitHub Issues</text>
  <text class="lbl small" x="730" y="216" text-anchor="middle">同一份</text>

  <text class="lbl good" x="230" y="386" text-anchor="middle">看得到彼此在問什麼</text>
</svg>
